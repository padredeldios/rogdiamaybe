  vat:      {el:"Οι τιμές περιλαμβάνουν ΦΠΑ. Ενημερώστε μας για τυχόν αλλεργίες.",en:"Prices include VAT. Please tell us about any allergies.",de:"Preise inkl. MwSt. Bitte informieren Sie uns über Allergien.",fr:"Prix TTC. Merci de nous signaler toute allergie."},
  bookT:    {el:"Κλείσε τραπέζι",en:"Reserve your table",de:"Reservieren Sie Ihren Tisch",fr:"Réservez votre table"},
  bookP:    {el:"Για κρατήσεις και παρέες, πάρε μας τηλέφωνο.",en:"For reservations and groups, give us a call.",de:"Für Reservierungen und Gruppen rufen Sie uns an.",fr:"Pour réserver ou pour les groupes, appelez-nous."},
  call:     {el:"Τηλεφώνησε",en:"Call us",de:"Anrufen",fr:"Appeler"},
  wa:       {el:"WhatsApp",en:"WhatsApp",de:"WhatsApp",fr:"WhatsApp"},
  locT:     {el:"Θα μας βρεις",en:"Find us",de:"So finden Sie uns",fr:"Nous trouver"},
  directions:{el:"Οδηγίες στο Google Maps",en:"Directions on Google Maps",de:"Route in Google Maps",fr:"Itinéraire Google Maps"},
  hoursT:   {el:"Ωράριο",en:"Opening hours",de:"Öffnungszeiten",fr:"Horaires"},
  langLbl:  {el:"Γλώσσα",en:"Language",de:"Sprache",fr:"Langue"}
};
/* ===================================================================== */
</script>

<div class="topbar">
  <span data-t="topline"></span>
  <a id="topPhone"></a>
</div>

<header>
  <div class="head-in">
    <a class="brand" href="#top" aria-label="Ρογδιά">
      <img class="logo-img" alt="Ρογδιά καφενείον">
      <span class="site-name"></span>
    </a>
    <div class="head-right">
      <nav class="mainnav">
        <a href="#spaces" data-t="navSpaces"></a>
        <a href="#menu" data-t="navMenu"></a>
        <a href="#location" data-t="navLoc"></a>
      </nav>
      <div class="langs" id="langs" role="group"></div>
    </div>
  </div>
</header>

<section class="hero" id="top">
  <div class="ph" id="heroPh"></div>
  <div class="hero-in">
    <div class="eyebrow" data-t="eyebrow"></div>
    <h1 data-t="heroT"></h1>
    <p data-t="heroP"></p>
    <div class="cta">
      <a class="btn" href="#book" data-t="book"></a>
      <a class="btn ghost" href="#menu" data-t="seeMenu"></a>
    </div>
  </div>
</section>

<section class="sec intro">
  <div class="wrap">
    <div class="logo-big"><img class="logo-img" alt="Ρογδιά καφενείον"></div>
    <p class="big" data-t="intro"></p>
  </div>
</section>

<section class="sec" id="spaces" style="padding-top:40px">
  <div class="wrap" id="spacesList"></div>
</section>

<section class="sec menu-sec" id="menu">
  <div class="wrap center">
    <h2 class="sec-title" data-t="navMenu"></h2>
    <p class="sec-sub" data-t="menuSub"></p>
  </div>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div class="menu-list" id="menuList"></div>
    <p class="menu-note" data-t="vat"></p>
  </div>
</section>

<section class="sec book" id="book">
  <div class="wrap">
    <h2 class="sec-title" data-t="bookT"></h2>
    <p class="sec-sub" style="margin:10px auto 0" data-t="bookP"></p>
    <div class="cta" id="bookBtns"></div>
    <p class="num" id="bookNum"></p>
  </div>
</section>

<section class="sec" id="location">
  <div class="wrap loc">
    <div>
      <h2 class="sec-title" data-t="locT"></h2>
      <address id="addr"></address>
      <div class="hours" id="hours"></div>
      <a class="btn outline" id="mapsBtn" target="_blank" rel="noopener" data-t="directions"></a>
    </div>
    <div class="ph" id="locPh"></div>
  </div>
</section>

<footer>
  <div class="flogo"><img class="logo-img" alt="Ρογδιά καφενείον"></div>
  <div id="footAddr"></div>
  <div class="social" id="social"></div>
  <small>© <span id="yr"></span> <span class="site-name"></span></small>
</footer>

<script>
const FLAGS = { el:"ΕΛ", en:"EN", de:"DE", fr:"FR", it:"IT" };
const GLOBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>';
const IG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>';
const t = (o, l) => (o && (o[l] || o[SITE.defaultLang] || o.en)) || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmt = p => p.toFixed(2).replace(".", ",") + " " + SITE.currency;
const photo = p => p.src ? `<img src="${esc(p.src)}" alt="${esc(p.label)}" loading="lazy">` : `<span class="lbl">${esc(p.label)}</span>`;
const $ = id => document.getElementById(id);
let lang, activeCat = MENU[0].id;

function pickLang(){
  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch(e){}
  const fromUrl = new URLSearchParams(location.search).get("lang");
  for (const c of [fromUrl, saved, (navigator.language||"").slice(0,2)])
    if (SITE.languages.includes(c)) return c;
  return SITE.defaultLang;
}

function renderMenu(){
  $("tabs").innerHTML = MENU.map(c =>
    `<button class="${c.id===activeCat?"active":""}" onclick="setCat('${c.id}')">${esc(t(c.title, lang))}</button>`).join("");
  const cat = MENU.find(c => c.id === activeCat);
  $("menuList").innerHTML = cat.items.map(i => `
    <div class="mi">
      <div>
        <div class="n">${esc(t(i.name, lang))}</div>
        ${i.desc ? `<div class="d">${esc(t(i.desc, lang))}</div>` : ""}
        ${i.tags ? i.tags.map(g => `<span class="tag">${esc(t(TAGS[g], lang))}</span>`).join("") : ""}
      </div>
      <div class="p">${fmt(i.price)}</div>
    </div>`).join("");
}

function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll(".site-name").forEach(e => e.textContent = SITE.name);
  document.querySelectorAll(".logo-img").forEach(e => e.src = SITE.logo);
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(UI[e.dataset.t], lang));
  const tel = "+30" + SITE.phone.replace(/\s/g, "");
  $("topPhone").textContent = "☎ " + SITE.phone; $("topPhone").href = "tel:" + tel;

  $("langs").setAttribute("aria-label", t(UI.langLbl, lang));
  $("langs").innerHTML = GLOBE + SITE.languages.map(l =>
    `<button class="${l===lang?"active":""}" aria-pressed="${l===lang}" onclick="setLang('${l}')">${FLAGS[l]||l.toUpperCase()}</button>`).join("");

  $("heroPh").innerHTML = photo(SITE.hero);
  $("locPh").innerHTML = photo(SITE.locationPhoto);

  $("spacesList").innerHTML = SPACES.map((s, i) => `
    <div class="space ${i % 2 ? "rev" : ""}">
      <div class="strip">${s.photos.map(p => `<div class="ph">${photo(p)}</div>`).join("")}</div>
      <div class="space-txt">
        <span class="time">${esc(t(s.time, lang))}</span>
        <h3>${esc(t(s.title, lang))}</h3>
        <p>${esc(t(s.text, lang))}</p>
      </div>
    </div>`).join("");

  renderMenu();

  $("bookBtns").innerHTML =
    `<a class="btn" href="tel:${tel}">${esc(t(UI.call, lang))}</a>` +
    (SITE.whatsapp ? `<a class="btn" href="https://wa.me/${SITE.whatsapp}" target="_blank" rel="noopener">${esc(t(UI.wa, lang))}</a>` : "");
  $("bookNum").textContent = SITE.phone;

  $("addr").textContent = t(SITE.address, lang);
  $("hours").innerHTML = `<div><strong>${esc(t(UI.hoursT, lang))}</strong><span></span></div>` +
    SITE.hours.map(h => `<div><span>${esc(t(h.d, lang))}</span><span>${h.h}</span></div>`).join("");
  $("mapsBtn").href = SITE.mapsUrl;

  $("footAddr").textContent = t(SITE.address, lang) + " · " + SITE.phone;
  $("social").innerHTML = SITE.instagram ? `<a href="${SITE.instagram}" target="_blank" rel="noopener">${IG}@rogdia_</a>` : "";
  $("yr").textContent = new Date().getFullYear();
  document.title = SITE.name + " — " + t(UI.eyebrow, lang);
}

function setLang(l){ lang = l; try { localStorage.setItem("lang", l); } catch(e){} render(); }
function setCat(id){ activeCat = id; renderMenu(); }

lang = pickLang();
render();
</script>
</body>
</html>
